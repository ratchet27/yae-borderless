; You Are Empty: Absolute Edition - borderless fullscreen settings.
; Restart the game after changing this file.

[borderless]

; borderless  Fullscreen at desktop resolution runs as a borderless window.
; exclusive   Mod disabled: the game's original exclusive fullscreen.
mode = borderless

; dxgi    Present frames through DXGI flip model: no blink on alt-tab.
;         Falls back to "opengl" automatically if the GPU driver lacks support.
; opengl  The game's own OpenGL present. The window is made 1px taller than the
;         screen so the driver does not treat it as exclusive fullscreen.
present = dxgi

; full       Keep rendering at full speed while the game is in the background.
; throttled  The game's original behaviour: 5 FPS while in the background.
background_fps = full
